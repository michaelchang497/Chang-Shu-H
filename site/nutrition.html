<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>營養照護紀錄 · 彰秀醫院 AI 智慧衛教與臨床營養照護平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 色票與字型對齊測試站台（Tailwind slate / emerald / teal） */
:root{
  --font-sans:"Inter","Noto Sans TC",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
  --bg:#f8fafc; --card:#fff;
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1; --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b; --s900:#0f172a;
  --em50:#ecfdf5; --em100:#d1fae5; --em200:#a7f3d0; --em300:#6ee7b7; --em400:#34d399; --em600:#059669; --em700:#047857; --em800:#065f46; --em950:#022c22;
  --te50:#f0fdfa; --te100:#ccfbf1; --te200:#99f6e4; --te600:#0d9488; --te700:#0f766e; --te800:#115e59; --te900:#134e4a;
  --ro50:#fff1f2; --ro100:#ffe4e6; --ro500:#f43f5e; --ro600:#e11d48; --ro700:#be123c;
  --am50:#fffbeb; --am100:#fef3c7; --am200:#fde68a; --am600:#d97706; --am700:#b45309; --am800:#92400e;
  --sk50:#f0f9ff; --sk100:#e0f2fe; --sk700:#0369a1;
  --in600:#4f46e5; --or700:#c2410c;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--s900);font:13px/1.55 var(--font-sans)}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--font-mono)}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic.sm{width:14px;height:14px}

/* ---------- navbar（同測試站台） ---------- */
.navbar{background:linear-gradient(to right,var(--em800),var(--te800),var(--s900));color:#fff;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border-bottom:1px solid var(--em950);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:44px;width:auto;border-radius:6px;background:#fff;padding:4px;display:block}
.brand p{margin:0;font-size:10px;color:var(--em300)}
.seg{display:flex;align-items:center;background:rgba(2,6,23,.4);border-radius:12px;padding:4px;border:1px solid rgba(4,120,87,.3);box-shadow:inset 0 2px 4px rgba(0,0,0,.05)}
.seg a{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--s400);text-decoration:none;transition:.15s}
.seg a:hover{color:var(--s200)}
.seg a.on{background:linear-gradient(to right,var(--te600),var(--em600));color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg a .new{font-size:9px;font-family:var(--font-mono);background:var(--em400);color:var(--em950);border-radius:4px;padding:0 4px;line-height:14px}
.nav-r{display:flex;align-items:center;gap:16px}
.nav-user{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--em200)}
.nav-user input{background:rgba(19,78,74,.4);border:1px solid var(--te700);border-radius:4px;padding:4px 10px;font-size:12px;color:#fff;width:176px;font-weight:600;text-align:center}
.nav-user input:focus{outline:none;border-color:#2dd4bf}
.his{padding:2px 10px;background:rgba(2,44,34,.4);border:1px solid rgba(4,120,87,.3);border-radius:6px;font-size:10px;color:var(--em300);font-family:var(--font-mono);text-transform:uppercase}

.demo-note{max-width:1280px;margin:16px auto 0;padding:0 24px}
.demo-note div{background:var(--am50);border:1px solid var(--am200);color:var(--am800);border-radius:8px;padding:6px 12px;font-size:11px;display:flex;gap:6px;align-items:center}

/* ---------- 版面 ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;align-items:start;padding-bottom:110px}
.lcol{display:flex;flex-direction:column;gap:24px;min-width:0}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--s200);min-width:0}
.card.pad{padding:20px}
.card h2{font-size:13px;font-weight:700;color:var(--s800);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--s100);padding-bottom:12px;margin:0 0 16px}
.card h2 .ic{color:var(--em600)}
.card h2 small{margin-left:auto;font-weight:500;font-size:10px;color:var(--s400);font-family:var(--font-mono)}

.tip{background:var(--s50);border:1px solid var(--s100);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--s500);margin-top:12px;line-height:1.6}
.tip b{color:var(--em700)}

.pitem{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:10px 12px;border:1px solid var(--s200);border-radius:10px;margin-bottom:8px;background:#fff;transition:.15s}
.pitem:last-child{margin-bottom:0}
.pitem:hover{border-color:var(--em200);background:#fcfffd}
.pitem.on{border-color:var(--em600);background:var(--em50);box-shadow:0 0 0 1px var(--em600)}
.pitem .r1{display:flex;align-items:center;gap:8px}
.pitem .nm{font-weight:700;font-size:13px;color:var(--s800)}
.pitem .sub{color:var(--s400);font-size:11px}
.pitem .id{font-family:var(--font-mono);font-size:11px;color:var(--s500);margin-top:2px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.st{margin-left:auto;font-size:10px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.st-draft{background:var(--te50);color:var(--te700);border:1px solid var(--te200)}
.st-signed{background:var(--em100);color:var(--em800);border:1px solid var(--em200)}
.tg{font-size:10px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--s100);color:var(--s600);white-space:nowrap}
.tg.red{background:var(--ro50);color:var(--ro700)}.tg.amb{background:var(--am50);color:var(--am700)}.tg.blu{background:var(--sk50);color:var(--sk700)}

/* 病人卡（HIS ACTIVE PATIENT） */
.pcard{overflow:hidden;background:linear-gradient(to bottom right,rgba(236,253,245,.1),#fff,#fff)}
.pcard .dk{background:var(--s900);padding:12px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.pcard .dk p{margin:0;font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--em300);display:flex;align-items:center;gap:8px}
.pcard .dk p i{width:8px;height:8px;border-radius:50%;background:var(--em400);display:inline-block;animation:pulse 2s infinite}
.pcard .dk span{font-size:10px;font-family:var(--font-mono);color:var(--s400)}
@keyframes pulse{50%{opacity:.4}}
.pcard .bd{padding:20px;display:flex;flex-direction:column;gap:16px}
.who{display:flex;align-items:center;gap:12px}
.av{height:40px;width:40px;border-radius:50%;background:var(--em100);color:var(--em800);display:grid;place-items:center;font-weight:700;font-size:15px}
.who .nm{font-size:15px;font-weight:700;color:var(--s800);display:flex;align-items:center;gap:8px}
.who .nm span{font-size:10px;font-weight:500;color:var(--s500);background:var(--s100);border-radius:4px;padding:1px 8px}
.who .id{font-size:11px;color:var(--s400);font-family:var(--font-mono);font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s50);padding:10px;border-radius:8px;border:1px solid var(--s100);text-align:center}
.stat3>div+div{border-left:1px solid var(--s200)}
.stat3 small{display:block;font-size:9px;color:var(--s400)}
.stat3 b{font-size:12px;color:var(--s800)}
.stat3 b.g{color:var(--em700)}
.kv small{display:block;font-size:10px;color:var(--s500);font-weight:600;margin-bottom:4px}
.kv div{background:var(--s50);border:1px solid var(--s100);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--s700);line-height:1.6}

.alert{display:flex;gap:8px;font-size:11.5px;padding:8px 10px;border-radius:8px;margin-bottom:8px;line-height:1.55;border:1px solid}
.alert:last-child{margin-bottom:0}
.alert .ic{margin-top:1px}
.alert.bad{background:var(--ro50);color:#9f1239;border-color:var(--ro100)}
.alert.warn{background:var(--am50);color:var(--am800);border-color:var(--am100)}
.alert.info{background:var(--te50);color:var(--te800);border-color:var(--te100)}

/* ---------- 右欄步驟頁籤 ---------- */
.rcol{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--s100);background:var(--s50);overflow-x:auto;align-items:center}
.tab{all:unset;cursor:pointer;padding:14px 4px;border-bottom:2px solid transparent;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--s500);white-space:nowrap}
.tab:hover{color:var(--s800)}
.tab.on{border-color:var(--te600);color:var(--te800)}
.tab .cnt{font-family:var(--font-mono);font-size:10px;background:var(--am100);color:var(--am700);border-radius:99px;padding:0 6px}
.tab .ok{font-size:10px;background:var(--em100);color:var(--em700);border-radius:99px;padding:0 6px}
.tabs .tact{margin-left:auto;display:flex;gap:8px}
.tbody{padding:24px}
.sech{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--s100);padding-bottom:12px;margin-bottom:20px;gap:12px}
.sech h3{margin:0;font-size:13px;font-weight:700;color:var(--te800);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sech p{margin:4px 0 0;font-size:11px;color:var(--s400)}
.pill{font-size:10px;font-weight:500;background:var(--em50);color:var(--em700);padding:2px 8px;border-radius:99px}
.pill.ai{background:var(--te50);color:var(--te700);border:1px solid var(--te200);font-weight:700}
.pill.gray{background:var(--s100);color:var(--s400)}
.sech .rt{text-align:right;flex:none}
.sech .rt small{font-size:10px;color:var(--s400);display:block}
.sech .rt b{font-size:12px;color:var(--s700)}

/* 趨勢圖 */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.chart{background:#fcfdfd;border:1px solid var(--s100);border-radius:12px;padding:14px 16px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chart .ch{font-size:12px;font-weight:700;color:var(--s700);border-bottom:1px solid var(--s100);padding-bottom:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chart .ch span{font-size:10px;font-family:var(--font-mono);white-space:nowrap}
.chart .ch span em{font-style:normal;color:var(--am600);margin-left:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}

/* 衛教中心紀錄卡（同「歷史專科營養照護紀錄」） */
.hist{background:#fff;border:1px solid var(--s200);border-radius:16px;padding:20px;margin-top:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hist .hh{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--s100);padding-bottom:12px;margin-bottom:16px}
.hist .hh h4{margin:0;font-size:13px;color:var(--te800);display:flex;align-items:center;gap:6px}
.hist .hh h4 .ic{color:var(--te600)}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.visit{border:1px solid var(--s300);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:11px}
.visit.last{border-color:var(--te600);box-shadow:0 0 0 1px var(--te600)}
.visit .d{font-family:var(--font-mono);font-weight:700;font-size:11px;background:var(--te50);color:var(--te800);border:1px solid var(--te100);padding:1px 8px;border-radius:6px;align-self:flex-start}
.visit small{font-size:9px;color:var(--s400);display:block;margin-bottom:2px}
.visit .num{font-family:var(--font-mono);color:var(--s600);border-top:1px dashed var(--s200);padding-top:6px;margin-top:auto;font-size:10px}
.visit .tags{margin-top:0}

.cta{margin-top:24px;background:linear-gradient(to right,var(--te50),var(--em50));border:1px solid var(--te100);border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px}
.cta .t{flex:1;font-size:11px;color:var(--s600);line-height:1.6}
.cta .t b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--te800);margin-bottom:2px}

/* 按鈕 */
.btn{border:1px solid var(--s200);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-size:12px;font-weight:600;color:var(--s700);display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.15s}
.btn:hover{background:var(--s50)}
.btn.pri{background:var(--em600);border-color:var(--em600);color:#fff}.btn.pri:hover{background:var(--em700)}
.btn.te{background:var(--te600);border-color:var(--te600);color:#fff}.btn.te:hover{background:var(--te700)}
.btn.pri:disabled{background:rgba(4,120,87,.4);border-color:transparent;cursor:not-allowed}
.btn.ai{color:var(--te700);border-color:var(--te200);background:var(--te50)}
.btn.sm{padding:3px 10px;font-size:11px}
.btn.lg{padding:9px 16px}

/* ---------- 營養評估單 ---------- */
.aitag{font-size:10px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--te50);color:var(--te700);border:1px solid var(--te200);white-space:nowrap}
.aitag.edited{background:var(--s100);color:var(--s500);border-color:var(--s200);font-weight:500}
.src{font-size:10px;font-weight:500;padding:1px 8px;border-radius:99px;background:var(--s100);color:var(--s500)}
.sec{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:18px 0;border-bottom:1px solid var(--s100)}
.sec:first-of-type{padding-top:0}
.sec:last-child{border-bottom:none;padding-bottom:0}
.sec>.k{width:32px;height:32px;border-radius:8px;background:linear-gradient(to bottom right,var(--te600),var(--em600));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;font-family:var(--font-mono)}
.sec>.v{min-width:0}
.fld{margin-bottom:16px}.fld:last-child{margin-bottom:0}
.lbl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--s700);margin-bottom:6px;font-weight:700;flex-wrap:wrap}
.lbl .aux{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
textarea,input.t,select{width:100%;border:1px solid var(--s200);border-radius:8px;padding:6px 10px;background:var(--s50);font-size:12px;color:var(--s800)}
textarea{resize:vertical;min-height:56px;line-height:1.65}
textarea.ai{border-color:var(--te200);background:#f7fefd}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--em600);background:#fff;box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.req{border-color:#fbbf24!important;background:var(--am50)!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.row>.cell{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--s500);font-weight:600}
.row>.cell input,.row>.cell select{width:100px}
.row>.cell .ro{min-width:64px;padding:6px 10px;border-radius:8px;background:#fff;border:1px solid var(--s100);color:var(--s800);font-weight:700;font-family:var(--font-mono);font-size:12px}
.row>.cell .hint{font-size:10px;color:var(--s400);font-weight:500}

table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;border:1px solid var(--s200);border-radius:10px;overflow:hidden}
table.grid th,table.grid td{border-right:1px solid var(--s100);border-bottom:1px solid var(--s100);padding:0;text-align:center}
table.grid th:last-child,table.grid td:last-child{border-right:none}
table.grid th{background:var(--s50);font-weight:600;color:var(--s500);font-size:10.5px;padding:6px 4px;line-height:1.3}
table.grid td.m{background:var(--s50);color:var(--s600);padding:0 10px;text-align:left;white-space:nowrap;font-size:11.5px;font-weight:600}
table.grid input{width:100%;border:none;border-radius:0;text-align:center;padding:6px 2px;background:transparent;font-family:var(--font-mono);font-size:12px;-moz-appearance:textfield;box-shadow:none}
table.grid input::-webkit-inner-spin-button,table.grid input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
table.grid input:focus{background:var(--em50);box-shadow:inset 0 0 0 2px var(--em400)}
table.grid tr.tot td{background:var(--te50);font-weight:700;padding:6px 2px;font-family:var(--font-mono);color:var(--te800);border-bottom:none}
table.grid tr.tot td.m{background:var(--te50);color:var(--te800);font-family:var(--font-sans)}
table.grid input.nz{font-weight:700;color:var(--s900)}
.gridwrap{overflow-x:auto}

.sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sum .b{border:1px solid var(--s200);border-radius:8px;padding:5px 12px;font-size:10px;color:var(--s500);background:#fff;font-weight:600}
.sum .b b{display:block;font-size:13px;color:var(--s800);font-family:var(--font-mono)}
.sum .b.ok{border-color:var(--em200);background:var(--em50)}.sum .b.ok b{color:var(--em700)}
.sum .b.warn{border-color:var(--am200);background:var(--am50)}.sum .b.warn b{color:var(--am700)}
.sum .note{align-self:center;font-size:10px;color:var(--s400)}

.judge{display:flex;gap:6px;flex-wrap:wrap}
.jd{border:1px solid var(--s200);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--s500);background:#fff}
.jd b{margin-left:4px}
.j-不足{color:var(--sk700)}.j-過多{color:var(--ro600)}.j-適量,.j-適當{color:var(--em700)}.j-不適當{color:var(--am700)}
.sel4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.sel2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sel4 .cell,.sel2 .cell{font-size:10px;color:var(--s500);font-weight:600;display:flex;flex-direction:column;gap:3px}

.edu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.edu label{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--s200);border-radius:8px;cursor:pointer;font-size:12px;background:#fff;min-height:34px}
.edu label.on{border-color:var(--em300);background:var(--em50)}
.edu label .nm{flex:1}
.edu input[type=checkbox]{accent-color:var(--em600)}
.edu select{width:auto;padding:1px 6px;font-size:11px}
.edu .sg{color:var(--te600);font-size:10px}

/* 底部操作列 */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--s200);z-index:6;box-shadow:0 -4px 14px rgba(15,23,42,.06)}
.bar .in{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:10px}
.bar .msg{font-size:12px;color:var(--s600)}
.bar .msg b{color:var(--am700)}
.bar .msg.ok b{color:var(--em700)}
.bar .acts{margin-left:auto;display:flex;gap:8px}
.pend{cursor:pointer;text-decoration:underline;color:var(--te700);margin-left:8px;font-size:11px;background:none;border:none;padding:0;font-weight:600}

/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;z-index:20;overflow:auto;padding:30px 16px}
.mask.on{display:block}
.modal{background:#fff;border-radius:16px;max-width:440px;margin:12vh auto 0;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);overflow:hidden}
.modal .mh{background:linear-gradient(to right,var(--em600),var(--te700));color:#fff;padding:14px 20px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.modal .mb{padding:20px;font-size:12.5px;color:var(--s600)}

/* 院方格式紙本 */
.paper{background:var(--s100);border-radius:12px;padding:20px;border:1px solid var(--s200)}
.form{border:1.5px solid #333;font-family:"Noto Serif TC","PMingLiU",serif;font-size:14px;color:#111;background:#fff;max-width:820px;margin:0 auto;box-shadow:0 10px 15px -3px rgba(0,0,0,.08)}
.form .title{text-align:center;font-weight:700;font-size:17px;padding:6px;border-bottom:1.5px solid #333;letter-spacing:.08em}
.form .hdr{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1.5px solid #333}
.form .hdr div{padding:4px 8px;border-right:1px solid #333}.form .hdr div:last-child{border-right:none}
.form .body{padding:8px 12px 10px}
.form .s{display:grid;grid-template-columns:34px 1fr;margin-bottom:4px}.form .s>.k{font-weight:700}
.form .meal{padding-left:2.2em}
.form .labs{display:flex;flex-wrap:wrap;gap:2px 22px}
.form .sign{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid #333}
.form .sign div{padding:10px 8px}.form .sign div+div{border-left:1px solid #333}
.form .foot{font-size:12px;padding:4px 8px;border-top:1px solid #333}
.stamp{display:inline-block;border:2px solid #c22a2a;color:#c22a2a;padding:0 8px;border-radius:4px;font-family:var(--font-sans);font-size:12px;transform:rotate(-4deg)}
.signbox{display:flex;align-items:center;gap:12px;margin-top:20px;padding:16px;border-radius:12px;border:1px solid var(--s200);background:#fff}
.signbox.ok{border-color:var(--em200);background:var(--em50)}
.signbox .t{flex:1;font-size:12px;color:var(--s600)}
.signbox .t b{display:block;font-size:13px;color:var(--s800)}

.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s900);color:#fff;padding:8px 18px;border-radius:8px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:12px}
.toast.on{opacity:1;transform:translateX(-50%)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--te200);border-top-color:var(--te700);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.locked textarea,.locked input,.locked select{pointer-events:none;background:var(--s100)!important;color:var(--s500)}

/* ---------- 流程與輸入對照 ---------- */
.st-wait{background:var(--am50);color:var(--am700);border:1px solid var(--am200)}
.prog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.prog li{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--s400);padding:6px 0;position:relative}
.prog li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--s100);color:var(--s400);flex:none;font-family:var(--font-mono)}
.prog li.done{color:var(--s700)}.prog li.done span{background:var(--em600);color:#fff}
.prog li.now{color:var(--te800);font-weight:700}.prog li.now span{background:var(--te50);color:var(--te700);box-shadow:0 0 0 2px var(--te600)}

.chip-src{font-size:10px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap;margin-right:4px;border:1px solid}
.chip-src.dx{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
.chip-src.nr{background:#fdf2f8;color:#be185d;border-color:#fbcfe8}
.chip-src.lb{background:var(--sk50);color:var(--sk700);border-color:#bae6fd}
.chip-src.dt{background:var(--em50);color:var(--em700);border-color:var(--em200)}
.mt{font-size:10px;font-weight:700;padding:1px 8px;border-radius:6px;white-space:nowrap}
.m-ok{background:var(--em100);color:var(--em800)}.m-part{background:var(--am100);color:var(--am800)}
.m-alt{background:#fce7f3;color:#9d174d}.m-none{background:var(--s100);color:var(--s500)}
.maptbl{border:1px solid var(--s200);border-radius:12px;overflow:hidden;margin-bottom:20px}
.maptbl table{width:100%;border-collapse:collapse;font-size:12px}
.maptbl th{background:var(--s50);color:var(--s500);font-size:10.5px;font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--s200)}
.maptbl td{padding:8px 12px;border-bottom:1px solid var(--s100);color:var(--s700);vertical-align:top}
.maptbl td small{display:block;color:var(--s400);font-size:10.5px;margin-top:2px}
.maptbl .use{padding:10px 12px;background:var(--te50);font-size:11px;color:var(--te800);font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:4px 0}
.inblk{border:1px solid var(--s200);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:#fff}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ih b{font-size:13px;color:var(--s800)}
.ihn{font-size:10.5px;color:var(--s400)}
.dxrow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;font-size:12px;color:var(--s700)}
.dxrow small{display:block;font-size:10px;color:var(--s400);font-weight:600;margin-bottom:2px}
.lvrow{display:flex;flex-wrap:wrap;gap:8px}
.lv{border:1px solid var(--s200);border-radius:8px;padding:4px 10px;background:var(--s50);min-width:76px}
.lv small{display:block;font-size:9.5px;color:var(--s400);font-weight:600}
.lv b{font-family:var(--font-mono);font-size:13px;color:var(--s800)}
.lv i{font-style:normal;font-size:9.5px;color:var(--s400);margin-left:4px;font-family:var(--font-mono)}

.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:20px}
.fs{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:10px;border:1px solid var(--s200);background:#fff}
.fs>span{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--s100);color:var(--s400);font-family:var(--font-mono)}
.fs b{display:block;font-size:11.5px;color:var(--s600);line-height:1.35}
.fs small{font-size:10px;color:var(--s400);font-family:var(--font-mono)}
.fs.done{background:var(--em50);border-color:var(--em200)}.fs.done>span{background:var(--em600);color:#fff}.fs.done b{color:var(--em800)}
.fs.now{background:var(--te50);border-color:var(--te600);box-shadow:0 0 0 1px var(--te600)}.fs.now>span{background:var(--te600);color:#fff}.fs.now b{color:var(--te800)}
.basis{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--s400);font-weight:500;margin-left:6px}
.hintx{font-size:10px;color:var(--em700);font-weight:600}
.visitbox{border:1px dashed var(--te200);background:#fbfefe;border-radius:12px;padding:16px;margin:4px 0 16px}
.vbh{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--te800)}
.vbh b{font-size:13px}
.vbh .pend{margin-left:auto}
.totrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--s50);border:1px solid var(--s200);font-size:11px;color:var(--s500)}
.totrow .tl{font-weight:700;color:var(--s700)}
.totrow b{font-family:var(--font-mono);font-size:14px;color:var(--s800);margin:0 3px}
.totrow .note{margin-left:auto;font-size:10px;color:var(--s400)}
.hisprev{border:1px solid var(--s200);border-radius:12px;overflow:hidden;margin-bottom:4px}
.hp-h{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--s900);color:var(--em300);font-size:11px;font-weight:700;font-family:var(--font-mono)}
.hisprev pre{margin:0;padding:12px 14px;white-space:pre-wrap;font:12px/1.7 var(--font-sans);color:var(--s700);background:#fff}

.gate{display:flex;align-items:center;gap:14px;padding:22px;border-radius:12px;border:1px dashed var(--s300);background:var(--s50);color:var(--s500);font-size:12px;line-height:1.7}
.gate>svg{width:28px;height:28px;color:var(--s400)}
.gate>div{flex:1}.gate b{display:block;font-size:13px;color:var(--s800)}
.gate.go{border-color:var(--te200);background:var(--te50)}.gate.go>svg{color:var(--te600)}
.goalbox{border:1px solid var(--s200);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.goals label{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 8px;border:1px solid var(--s200);border-radius:8px;cursor:pointer;background:#fff}
.goals label.on{border-color:var(--em300);background:var(--em50)}
.goals input{accent-color:var(--em600)}
.edhint{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--s500);margin:0 0 10px}

/* ---------- 衛教單張（病人版） ---------- */
.flyer{background:#fff;max-width:760px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 10px 25px -5px rgba(15,23,42,.12);font-size:14px;color:var(--s800)}
.fh{display:flex;align-items:center;gap:16px;padding:18px 22px;background:linear-gradient(to right,var(--em700),var(--te700));color:#fff}
.fh img{height:46px;background:#fff;border-radius:8px;padding:4px}
.fh small{font-size:11px;color:var(--em200)}
.fh h3{margin:2px 0;font-size:20px;letter-spacing:.02em}
.fh p{margin:0;font-size:11.5px;color:var(--em100);font-family:var(--font-mono)}
.fhero{display:flex;align-items:center;gap:22px;padding:16px 22px;background:var(--em50);border-bottom:1px solid var(--em100);flex-wrap:wrap}
.fhero>div{text-align:center}
.fhero small{display:block;font-size:11px;color:var(--em700);font-weight:600}
.fhero b{font-size:30px;font-weight:700;color:var(--em800);font-family:var(--font-mono);line-height:1.1}
.fhero span{font-size:12px;color:var(--em700);margin-left:2px}
.fhero p{margin:0;flex:1;min-width:200px;font-size:14px;font-weight:700;color:var(--em800);line-height:1.6}
.fhero em{font-style:normal;font-weight:500;font-size:12px;color:var(--am800)}
.fsec{position:relative;padding:14px 22px;border-bottom:1px solid var(--s100)}
.fsec h4{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;color:var(--te800)}
.fi{width:28px;height:28px;border-radius:8px;background:var(--te50);color:var(--te700);display:grid;place-items:center}
.fi svg{width:16px;height:16px}
.fhide{position:absolute;top:12px;right:14px;border:1px solid var(--s200);background:#fff;border-radius:6px;width:24px;height:24px;display:grid;place-items:center;cursor:pointer;color:var(--s400)}
.fhide:hover{color:var(--ro600);border-color:var(--ro100)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{border:1px solid var(--s200);border-radius:12px;padding:10px 12px;text-align:center;background:linear-gradient(#fff,#fbfdfc)}
.pic{width:44px;height:44px;margin:0 auto 4px;border-radius:50%;background:var(--em50);color:var(--em700);display:grid;place-items:center}
.pic svg{width:26px;height:26px;stroke-width:1.6}
.pn{font-size:12px;font-weight:700;color:var(--s700)}
.pv{font-size:12px;color:var(--s500)}.pv b{font-size:24px;color:var(--em700);font-family:var(--font-mono)}
.pu{font-size:12px;color:var(--s700);font-weight:600}
.px{font-size:10.5px;color:var(--s400);margin-top:2px}
.plow{font-size:10.5px;color:var(--am700);background:var(--am50);border-radius:6px;margin-top:4px;padding:1px 4px}
.fl{margin:0;padding-left:20px;line-height:1.8}
.fl li::marker{color:var(--em600)}
[contenteditable]{border-radius:4px;outline:none;padding:0 2px;transition:.15s}
[contenteditable]:hover{background:var(--am50);box-shadow:0 0 0 1px var(--am200)}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--em400)}
.menu{width:100%;border-collapse:collapse;font-size:13px}
.menu th{width:56px;text-align:left;color:var(--te700);padding:6px 0;vertical-align:top;font-size:12.5px}
.menu td{padding:6px 0;border-bottom:1px dashed var(--s200);color:var(--s700)}
.menu tr:last-child td{border-bottom:none}
.fsec p{margin:0 0 6px;line-height:1.7}
.swaps{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:8px;background:var(--s50)}
.sw .a{color:var(--s500);text-decoration:line-through}.sw .b{color:var(--em800);font-weight:700}
.sw svg{color:var(--em600)}
.sw em{margin-left:auto;font-style:normal;font-family:var(--font-mono);color:var(--em700);font-weight:700}
.swt{text-align:right;font-size:12px;font-weight:700;color:var(--em800)}
.warn{display:flex;align-items:center;gap:6px;font-size:13px;color:#9f1239;background:var(--ro50);border:1px solid var(--ro100);border-radius:8px;padding:6px 10px}
.restore{padding:8px 22px;font-size:11px;color:var(--s400)}
.ff{display:flex;align-items:center;gap:16px;padding:16px 22px;background:var(--s50)}
.qr{width:100px;height:100px;flex:none;background:#fff;border:1px solid var(--s200);border-radius:8px;padding:4px;display:grid;place-items:center}
.qr img,.qr canvas{display:block;width:92px!important;height:92px!important}
.qrfb{font-family:var(--font-mono);color:var(--s400)}
.ff b{font-size:13px;color:var(--s800)}
.ff p{margin:4px 0;font-size:12.5px;color:var(--em800);font-weight:600}
.ff small{font-size:10.5px;color:var(--s400)}
body.flyer-only{background:var(--s100);padding:16px}
body.flyer-only .paper{background:none;border:none;padding:0}
.demo-foot{text-align:center;font-size:11px;color:var(--s400);margin:12px 0}
@media (max-width:760px){
  .flow,.goals,.dxrow{grid-template-columns:1fr 1fr}.pgrid{grid-template-columns:1fr 1fr}
  .fsec{padding:12px 14px}.fh,.fhero,.ff{padding-left:14px;padding-right:14px}
}

/* ---------- AI 判讀動畫 ---------- */
.aiwork{border:1px solid var(--te200);background:linear-gradient(135deg,#f0fdfa,#ecfdf5 60%,#fff);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 14px -6px rgba(13,148,136,.25);animation:awIn .35s ease both}
@keyframes awIn{from{opacity:0;transform:translateY(-6px)}}
.aw-h{display:flex;align-items:center;gap:10px}
.aw-h b{display:block;font-size:13px;color:var(--te800)}
.aw-t{font-size:11px;color:var(--te700)}
.aw-h .pend{margin-left:auto}
.aw-orb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:conic-gradient(from 0deg,var(--te600),var(--em400),#818cf8,var(--te600));animation:spinOrb 1.6s linear infinite;flex:none}
.aw-orb svg{animation:spinOrb 1.6s linear infinite reverse}
.aiwork.done .aw-orb{animation:none;background:var(--em600)}.aiwork.done .aw-orb svg{animation:none}
@keyframes spinOrb{to{transform:rotate(360deg)}}
.aw-bar{height:4px;border-radius:99px;background:var(--te100);margin:12px 0 10px;overflow:hidden}
.aw-bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--te600),var(--em400),var(--te600));background-size:200% 100%;animation:shimmer 1.2s linear infinite;transition:width .45s ease}
@keyframes shimmer{to{background-position:-200% 0}}
.aw-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.aw-steps li{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--s400);opacity:.45;transition:.25s}
.aw-steps li.run,.aw-steps li.ok{opacity:1;color:var(--s700)}
.aw-steps li b{font-weight:600}
.aw-steps li small{display:block;font-size:11px;color:var(--te700);animation:awIn .3s ease both}
.aw-steps li small:empty{display:none}
.aw-s{width:16px;height:16px;border-radius:50%;border:2px solid var(--s300);flex:none;margin-top:1px;position:relative}
.aw-steps li.run .aw-s{border-color:var(--te200);border-top-color:var(--te600);animation:spinOrb .7s linear infinite}
.aw-steps li.ok .aw-s{border-color:var(--em600);background:var(--em600)}
.aw-steps li.ok .aw-s::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fld.dim{opacity:.45;transition:.2s}
textarea.typing{border-color:var(--te600)!important;box-shadow:0 0 0 3px rgba(13,148,136,.15);caret-color:transparent;background:#fff}
.flyer.reveal .fh,.flyer.reveal .fhero,.flyer.reveal .fsec,.flyer.reveal .pc,.flyer.reveal .ff{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.aiwork,.aw-orb,.aw-orb svg,.aw-bar i,.flyer.reveal *{animation:none!important}}

/* ---------- 住院／門診切換與門診紀錄 ---------- */
.mswitch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--s100);border-radius:10px;padding:4px;margin-bottom:16px}
.mswitch button{all:unset;cursor:pointer;text-align:center;padding:7px 0;border-radius:8px;font-size:13px;font-weight:700;color:var(--s500);transition:.15s}
.mswitch button small{display:block;font-size:9.5px;font-weight:500;font-family:var(--font-mono);color:var(--s400)}
.mswitch button:hover{color:var(--s800)}
.mswitch button.on{background:#fff;color:var(--te800);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.mswitch button.on small{color:var(--te600)}
.mswitch button:focus-visible{outline:2px solid var(--te600)}
.newtag{font-size:9.5px;font-weight:700;padding:0 6px;border-radius:4px;background:#fef9c3;color:#854d0e;border:1px solid #fde68a;white-space:nowrap;margin-left:4px;line-height:16px}
.hdrow{margin-bottom:16px;padding:12px 14px;border-radius:12px;background:var(--s50);border:1px solid var(--s200)}
.hdrow .cell select{width:190px}
.cell>.newtag{align-self:flex-start;margin:0 0 2px}
.typeblk{border-color:#fde68a;background:#fffdf5}
.mapfold{margin-bottom:16px}
.mapfold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:12px;color:var(--s700);background:var(--s50)}
.mapfold summary::-webkit-details-marker{display:none}
.mapfold summary::after{content:"展開";margin-left:auto;font-size:10.5px;color:var(--te700);font-weight:600}
.mapfold[open] summary::after{content:"收合"}
.mapfold[open] summary{border-bottom:1px solid var(--s200)}
.dsel select{width:auto;padding:3px 8px;font-size:11.5px;font-family:var(--font-mono)}
.rad{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--s100)}
.rad:last-child{border-bottom:none}
.rad>span{width:84px;font-size:12px;font-weight:700;color:var(--s700)}
.rad label{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border:1px solid var(--s200);border-radius:99px;cursor:pointer;background:#fff}
.rad label.on{border-color:var(--em300);background:var(--em50);color:var(--em800);font-weight:600}
.rad input{accent-color:var(--em600);margin:0}
.ncp{border:1px solid var(--s100);border-radius:10px;padding:10px 12px;background:var(--s50)}
.ncp+.ncp{margin-top:10px}
.ncph{font-size:11.5px;font-weight:700;color:var(--te800);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.ncpg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1.3fr);gap:8px}
.ncpg .cell{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--s500);font-weight:600}
.ncpg select{background:#fff}
.goals label .newtag{margin-left:auto}
.pg{display:flex;flex-direction:column;gap:8px}
.pgb{position:relative;border:1px solid var(--s200);border-radius:10px;padding:10px 64px 10px 12px;background:#fff}
.pgb>b{display:block;font-size:12px;color:var(--s700);margin-bottom:6px}
.pgb>i{position:absolute;top:10px;right:12px;font-style:normal;font-family:var(--font-mono);font-weight:700;color:var(--te700);font-size:12px}
.pgb select{width:auto;max-width:100%}
.ck{display:flex;align-items:center;gap:6px;font-size:11.5px;align-self:flex-end;padding-bottom:6px}
.pgt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--te50);border:1px solid var(--te200);font-size:12px;color:var(--te800);font-weight:700}
.pgt b{font-family:var(--font-mono);font-size:20px}
.pgt span{font-weight:500}
.locked label{pointer-events:none}
.sigwrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.sigdoc{max-height:620px;overflow:auto;border-radius:12px}
.sigdoc .paper{padding:12px}
.sigdoc .flyer{font-size:12.5px}
.sigside{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
.sigstmt{font-size:13px;line-height:1.75;color:var(--s700);background:var(--s50);border:1px solid var(--s200);border-radius:12px;padding:12px 14px}
.sigstmt small{color:var(--s400);font-family:var(--font-mono);font-size:11px}
.sigpad{position:relative;height:200px;border:2px dashed var(--te200);border-radius:12px;background:#fff}
.sigpad canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:10px}
.sig-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--s300);font-size:15px;pointer-events:none}
.sigpad::after{content:"";position:absolute;left:24px;right:24px;bottom:44px;border-bottom:1px solid var(--s200);pointer-events:none}
.sigbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sigdone{border:1px solid var(--em200);background:#fff;border-radius:12px;padding:10px;text-align:center}
.sigdone img{max-width:100%;height:150px;object-fit:contain;display:block;margin:0 auto}
.sigdone small{font-size:11px;color:var(--em700)}
.fsig{margin-left:auto;text-align:center;flex:none}
.fsig small{display:block;font-size:10px;color:var(--s400)}
.fsig img{height:56px;width:auto;max-width:150px;display:block;border-bottom:1px solid var(--s300)}
@media (max-width:900px){.sigwrap{grid-template-columns:1fr}.sigside{position:static}.ncpg{grid-template-columns:1fr 1fr}}

@media (max-width:1100px){.vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1024px){.wrap{grid-template-columns:1fr}}
@media (max-width:760px){
  .navbar{flex-wrap:wrap;padding:10px 16px}.brand p,.nav-user,.his{display:none}
  .seg{order:3;width:100%;justify-content:space-between}
  .wrap{padding:16px 16px 140px}.demo-note{padding:0 16px}
  .charts,.edu,.vgrid{grid-template-columns:1fr}.sel4{grid-template-columns:1fr 1fr}
  .tbody{padding:16px}.tabs{padding:0 16px;gap:16px}
  .bar .in{flex-wrap:wrap;padding:10px 16px}
  .cta{flex-direction:column;align-items:stretch}
}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%}
  .paper{background:none;border:none;padding:0}.flyer{box-shadow:none}.fhide,.restore{display:none}
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roc = d => d ? `${d.slice(0,3)}/${d.slice(3,5)}/${d.slice(5,7)}` : '—';
const rocM = d => `${d.slice(0,3)}/${d.slice(3,5)}`;
const r1 = x => Math.round(x*10)/10;
const clone = o => JSON.parse(JSON.stringify(o));
const toDate = d => new Date(+d.slice(0,3)+1911, +d.slice(3,5)-1, +d.slice(5,7));
const daysBetween = (a,b) => Math.round((toDate(b)-toDate(a))/864e5);
const nowRoc = () => { const n=new Date(); return `${n.getFullYear()-1911}/${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')} ${n.toTimeString().slice(0,5)}`; };
function egfr2021(cr, age, sex){ const f=sex==='F',k=f?0.7:0.9,a=f?-0.241:-0.302;
  return 142*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(0.9938,age)*(f?1.012:1); }
const stageOf = e => e>=90?'G1':e>=60?'G2':e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5';
const STAGE = {G1:'CKD 1',G2:'CKD 2',G3a:'CKD 3a',G3b:'CKD 3b',G4:'CKD 4',G5:'CKD 5'};
const STAGE_ZH = {G1:'第 1 期',G2:'第 2 期',G3a:'第 3a 期',G3b:'第 3b 期',G4:'第 4 期',G5:'第 5 期'};
function totals(meals){ const t={}; for(const m of Object.values(meals)) for(const [g,n] of Object.entries(m)) if(n) t[g]=(t[g]||0)+n; return t; }
function nutr(t){ const o={kcal:0,P:0,F:0,C:0};
  for(const [g,n] of Object.entries(t)) for(const k of ['kcal','P','F','C']) o[k]+=EX[g][k]*n;
  for(const k of ['kcal','P','F','C']) o[k]=r1(o[k]);
  o.pct=o.kcal?{carb:r1(o.C*4/o.kcal*100),protein:r1(o.P*4/o.kcal*100),fat:r1(o.F*9/o.kcal*100)}:{carb:0,protein:0,fat:0};
  return o; }
function latest(c,key,on){ const rows=c.labs.filter(r=>r.key===key&&typeof r.value==='number'&&r.date<=on); return rows.length?rows[rows.length-1]:null; }
const series=(c,key)=>c.labs.filter(r=>r.key===key&&typeof r.value==='number');
const isEmpty = meals => !Object.values(meals).some(m=>Object.values(m).some(Boolean));

function makePlan(kcal, protein, ckdLow){
  const t={milk_f:1,fruit:2,veg:3}, base=nutr(t);
  const gAll=Math.max(6,Math.round((kcal*RULES.carbPct/100/4-base.C)/15));
  const lowN=ckdLow?Math.round(gAll*RULES.lowNShare):0;
  t.grain=gAll-lowN; if(lowN) t.lowN=lowN;
  t.meat_m=Math.max(2,Math.round((protein-base.P-t.grain*2)/7));
  t.oil=Math.max(2,Math.round((kcal-nutr(t).kcal)/45));
  return t;
}
function distribute(t, nMeals){
  const names=nMeals>=4?['早餐','午餐','晚餐','晚點']:['早餐','午餐','晚餐'];
  const m=Object.fromEntries(names.map(n=>[n,{}]));
  const put=(meal,g,n)=>{ if(n>0) m[meal][g]=(m[meal][g]||0)+n; };
  if(t.milk_f) put(nMeals>=4?'晚點':'早餐','milk_f',t.milk_f);
  const gAll=(t.grain||0)+(t.lowN||0), gb=Math.round(gAll*0.28), gd=Math.round((gAll-gb)/2), gl=gAll-gb-gd;
  let lowLeft=t.lowN||0;
  const split=(meal,n)=>{const ln=Math.min(lowLeft,meal==='早餐'?0:Math.ceil(n/2)); lowLeft-=ln; put(meal,'grain',n-ln); put(meal,'lowN',ln);};
  split('午餐',gl); split('晚餐',gd); split('早餐',gb);
  const mt=t.meat_m||0;
  if(mt>=3){put('早餐','meat_m',1);put('午餐','meat_m',1);put('晚餐','meat_m',mt-2);} else {put('午餐','meat_m',Math.ceil(mt/2));put('晚餐','meat_m',Math.floor(mt/2));}
  const v=t.veg||0; put('早餐','veg',1); put('午餐','veg',Math.ceil((v-1)/2)); put('晚餐','veg',Math.floor((v-1)/2));
  const f=t.fruit||0; put('午餐','fruit',Math.ceil(f/2)); put('晚餐','fruit',Math.floor(f/2));
  const o=t.oil||0; put('早餐','oil',Math.min(1,o)); put('午餐','oil',Math.ceil((o-1)/2)); put('晚餐','oil',Math.floor((o-1)/2));
  return m;
}

function derive(c, st){
  const b=baseOf(c,st);
  const intake=nutr(totals(st.recall)), plan=nutr(totals(st.plan));
  const pending=[];
  if(mode==='opd'){
    if(!st.dietText.trim()) pending.push('24 小時飲食紀錄');
    if(isEmpty(st.recall)) pending.push('六大類實際攝取');
    if(!st.ncp[0].P) pending.push('營養診斷');
    if(Object.values(st.learn).some(v=>!v)) pending.push('學習狀況評估');
  } else {
    if(isEmpty(st.recall)) pending.push('24 小時飲食回顧');
    if(!st.supplement.trim()) pending.push('訪視補充');
  }
  return {...b,intake,plan,pending,dg:diagnosisOf(c,b)};

  if(l('HbA1C')>7) hi.push(`血糖偏高（HbA1c ${l('HbA1C')}%）`);
  if(l('LDL-C')>100||l('TG')>150) hi.push(`血脂偏高（LDL ${l('LDL-C')}、TG ${l('TG')}）`);
  if(x.dg.dx.includes('高血壓')) hi.push('有高血壓');
  if(x.ckdLow||x.stage==='G3a'||x.stage==='G3b') hi.push(`腎功能${STAGE_ZH[x.stage]}`);
  return hi;

function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))), n=x/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function chart(rows, {color, ref, refLabel, refColor='#f43f5e'}){
  if(!rows.length) return '<div style="height:150px;display:grid;place-items:center;color:var(--s400);font-size:11px">無資料</div>';
  const W=360,H=150,L=34,R=8,T=10,B=22;
  const ts=rows.map(r=>toDate(r.date).getTime()), t0=Math.min(...ts), t1=Math.max(...ts), tr=(t1-t0)||1;
  const vs=rows.map(r=>r.value).concat(ref!=null?[ref]:[]);
  let lo=Math.min(...vs), hi=Math.max(...vs); const pad=(hi-lo)*0.15||Math.abs(hi)*0.1||1; lo=Math.max(0,lo-pad); hi=hi+pad;
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const X=t=>L+(t-t0)/tr*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const yt=[]; for(let v=lo; v<=hi+1e-9; v+=step) yt.push(+v.toFixed(2));
  const xt=[0,0.33,0.66,1].map(f=>t0+f*tr);
  const fmt=t=>{const d=new Date(t); return `${d.getFullYear()-1911}/${String(d.getMonth()+1).padStart(2,'0')}`;};
  const pts=rows.map((r,i)=>[X(ts[i]),Y(r.value)]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="趨勢圖">
    ${yt.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f1f5f9" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(v)+3}" font-size="9" fill="#64748b" text-anchor="end">${v}</text>`).join('')}
    <line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#334155" stroke-width="1"/>
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#334155" stroke-width="1"/>
    ${xt.map((t,i)=>`<line x1="${X(t)}" x2="${X(t)}" y1="${H-B}" y2="${H-B+4}" stroke="#334155"/><text x="${X(t)}" y="${H-B+14}" font-size="9" fill="#64748b" text-anchor="${i===0?'start':i===3?'end':'middle'}">${fmt(t)}</text>`).join('')}
    ${ref!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="${refColor}" stroke-dasharray="4 3"/><text x="${W-R-2}" y="${Y(ref)-4}" font-size="8" fill="${refColor}" text-anchor="end">${refLabel}</text>`:''}
    <polyline fill="none" stroke="${color}" stroke-opacity=".45" stroke-width="1.5" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>
    ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4:3}" fill="${i===pts.length-1?color:'#fff'}" stroke="${color}" stroke-width="2"><title>${roc(rows[i].date)}：${rows[i].value}</title></circle>`).join('')}
  </svg>`;
}

function hisNote(c,st,x){
  const parts=[st.note1.trim()];
  if(!isEmpty(st.recall)) parts.push(`飲食紀錄：目前攝取 ${x.intake.kcal} 大卡（蛋白質 ${x.intake.P} g、脂肪 ${x.intake.F} g、醣類 ${x.intake.C} g）；建議 ${st.kcal} 大卡、蛋白質 ${st.protein} g、${st.meals} 餐。`);
  if(st.supplement.trim()) parts.push(st.supplement.trim());
  return parts.join('\n');
}

function pgScore(st){ const p=st.extra.pg, w0=+p.wt0; let b1=0;
  if(w0>0&&st.wt<w0){ const l=(w0-st.wt)/w0*100; b1=l>=10?4:l>=5?3:l>=3?2:l>=2?1:0; }
  if(p.wDown) b1+=1;
  const b2=PG_INTAKE[p.intake][1], b3=p.sym.reduce((s,n)=>s+(PG_SYM.find(y=>y[0]===n)?.[1]||0),0), b4=PG_ACT[p.act][1], t=b1+b2+b3+b4;
  return {b1,b2,b3,b4,t,tri:t<=1?'目前不需介入，治療期間定期再評估':t<=3?'由營養師提供病人及家屬衛教':t<=8?'需營養師介入，並依症狀會同醫護處理':'急需改善症狀及營養介入'}; }

function initSig(st){
  const cv=$('#sigpad'); if(!cv) return;
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=2.4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#0f172a';
  if(st.sigDraft){ const im=new Image(); im.onload=()=>g.drawImage(im,0,0,r.width,r.height); im.src=st.sigDraft; }
  let on=false;
  cv.onpointerdown=e=>{ on=true; cv.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(e.offsetX,e.offsetY); g.lineTo(e.offsetX+.1,e.offsetY); g.stroke(); };
  cv.onpointermove=e=>{ if(!on) return; g.lineTo(e.offsetX,e.offsetY); g.stroke(); };
  cv.onpointerup=cv.onpointercancel=()=>{ if(!on) return; on=false; st.sigDraft=cv.toDataURL('image/png');
    const b=$('[data-act=sig-save]'); if(b) b.disabled=false; $('.sig-ph')?.remove(); };
}

           ['flyer','file','3. 衛教單張',st.f2==='saved'?'<span class="ok">已存檔</span>':st.f2==='draft'?'<span class="cnt">待審</span>':'']];
  const body=tab==='input'?renderInput(c,st,x):tab==='visit'?renderVisit(c,st,x):renderFlyerTab(c,st,x);
  return `<div class="tabs">${T.map(([k,i,t,b])=>`<button class="tab ${tab===k?'on':''}" data-act="tab" data-t="${k}">${ic(i)}<span>${t}</span>${b}</button>`).join('')}</div>
    <div class="tbody">${body}</div>`;
}
function renderBar(c, st, x){
  let msg, acts='';
  if(mode==='opd'){
    if(st.f1!=='done'){ const n=x.pending.length;
      msg=n?`個案 ${c.code}：門診紀錄尚有 <b>${n} 項</b>待填寫：${x.pending.join('、')}<button class="pend" data-act="fill">帶入示範門診資料</button>`:`個案 ${c.code}：<b style="color:var(--em700)">門診紀錄已填妥</b>，請按完成`;
      acts=`<button class="btn pri" data-act="confirm1" ${n?'disabled':''}>${ic('check','sm')}完成門診紀錄</button>`;
    } else if(st.f2==='none'){ msg=`個案 ${c.code}：<b style="color:var(--em700)">✓ 門診紀錄已完成</b>，可產生衛教單張`;
      acts=`<button class="btn te" data-act="gen2">${ic('sparkles','sm')}AI 產生衛教單張</button>`;
    } else if(st.f2==='draft'){ msg=`個案 ${c.code}：衛教單張 <b>待營養師審視</b>`;
      acts=`<button class="btn" data-act="print">${ic('printer','sm')}列印</button><button class="btn pri" data-act="save2">${ic('sign','sm')}審視完成，請病人簽名</button>`;
    } else if(st.f2==='review'){ msg=`個案 ${c.code}：衛教單張 <b>待病人簽名</b>`;
      acts=tab==='sign'?'':`<button class="btn te" data-act="tab" data-t="sign">${ic('sign','sm')}前往病人簽名</button>`;
    } else { msg=`<span class="ok"><b>✓ 已完成</b></span>　個案 ${c.code} · 病人已簽名，衛教單張已存檔為病歷 ${st.savedAt}`;
      acts=`<button class="btn" data-act="print">${ic('printer','sm')}列印</button>`; }
    $('#bar').innerHTML=`<div class="in"><span class="msg">${msg}</span><div class="acts">${acts}</div></div>`;
    return;
  }
  if(st.f1!=='done'){
    const n=x.pending.length;
    msg=n?`個案 ${c.code}：訪視紀錄尚有 <b>${n} 項</b>待營養師補充：${x.pending.join('、')}<button class="pend" data-act="fill">帶入示範訪視資料</button>`:`個案 ${c.code}：<b style="color:var(--em700)">訪視資料已補齊</b>，請確認訪視紀錄`;
    acts=`<button class="btn pri" data-act="confirm1" ${n?'disabled':''}>${ic('upload','sm')}確認並更新 HIS</button>`;
  } else if(st.f2==='none'){
    msg=`個案 ${c.code}：<b style="color:var(--em700)">✓ 訪視紀錄已確認</b>，可產生衛教單張`;
    acts=`<button class="btn te" data-act="gen2">${ic('sparkles','sm')}AI 產生衛教單張</button>`;
  } else if(st.f2==='draft'){
    msg=`個案 ${c.code}：衛教單張 <b>待營養師審視</b>`;
    acts=`<button class="btn" data-act="print">${ic('printer','sm')}列印</button><button class="btn pri" data-act="save2">${ic('upload','sm')}審視完成，回寫 HIS 存檔</button>`;
  } else {
    msg=`<span class="ok"><b>✓ 已完成</b></span>　個案 ${c.code} · 衛教單張已存檔為病歷 ${st.savedAt}`;
    acts=`<button class="btn" data-act="print">${ic('printer','sm')}列印</button>`;
  }
  $('#bar').innerHTML=`<div class="in"><span class="msg">${msg}</span><div class="acts">${acts}</div></div>`;
}

function render(){
  const c=DATA[cur], st=S(c), x=derive(c,st);
  const y=window.scrollY;
  $('#lcol').innerHTML=renderLeft(c,st,x);
  $('#rcol').innerHTML=renderRight(c,st,x);
  renderBar(c,st,x);
  drawQR(); initSig(st);
  window.scrollTo(0,y);
  if(mode==='ipd' && tab==='visit' && !st.ai1Played && st.f1!=='done' && !busy){ st.ai1Played=true; runVisitGen(c,st,'AI 於訪視前產生營養師訪視紀錄'); }
  if(st.reveal){ st.reveal=false; const fl=$('.flyer'); if(fl){ fl.classList.add('reveal');
    fl.querySelectorAll('.fh,.fhero,.fsec,.pc,.ff').forEach((el,i)=>el.style.animationDelay=`${i*90}ms`); } }
}

/* ---------- AI 判讀動畫（示範用：模擬模型逐步讀取輸入與產生內容） ---------- */
let busy=false, skipAnim=false;
const sleep=ms=>new Promise(r=>setTimeout(r,skipAnim?0:ms));
async function aiWork(host, title, steps){
  host.innerHTML=`<div class="aiwork"><div class="aw-h"><span class="aw-orb">${ic('sparkles')}</span><div><b>${title}</b><small class="aw-t">模型判讀中…</small></div><button class="pend" data-act="skip">略過動畫</button></div>
    <div class="aw-bar"><i></i></div><ol class="aw-steps">${steps.map(([l])=>`<li><span class="aw-s"></span><div><b>${l}</b><small></small></div></li>`).join('')}</ol></div>`;
  const lis=host.querySelectorAll('.aw-steps li'), bar=host.querySelector('.aw-bar i');
  for(let i=0;i<steps.length;i++){
    lis[i].classList.add('run'); bar.style.width=`${(i+.5)/steps.length*100}%`;
    await sleep(520+Math.random()*380);
    lis[i].classList.replace('run','ok'); lis[i].querySelector('small').textContent=steps[i][1];
    bar.style.width=`${(i+1)/steps.length*100}%`;
    await sleep(140);
  }
}
async function typeInto(el, text){
  el.classList.add('typing');
  for(let i=0;i<text.length && !skipAnim;i+=2+Math.floor(Math.random()*3)){ el.value=text.slice(0,i); el.scrollTop=el.scrollHeight; await sleep(18); }
  el.value=text; el.classList.remove('typing');
}
function visitSteps(c, x){
  const lv=c.visits[c.visits.length-1], n=c.labs.filter(r=>r.src==='HIS檢驗').length, fl=flagsOf(c,x);
  return [['讀取病人診斷',`${x.dg.main}；共病 ${x.dg.dx.length} 項`],
    ['讀取護理紀錄',`${c.visits.length} 筆，最近 ${roc(lv.date)}${lv.note?`「${lv.note}」`:''}`],
    ['讀取檢驗數值',`${n} 筆 · HbA1c ${lab(c,'HbA1C').value}% · Cr ${x.cr.value} · eGFR ${Math.round(x.egfr)}`],
    ['判讀臨床重點',fl.join('、')||'無明顯異常'],
    ['撰寫訪視紀錄','依 HIS 備註欄格式產生草稿']];
}
function flyerSteps(c, st, x){
  const t=totals(st.plan), ai=AI2[c.code];
  const portions=PORTION.map(p=>`${p.name.slice(0,2)} ${p.k==='grain'?(t.grain||0)+(t.lowN||0):(t[p.k]||0)}`).join(' · ');
  if(mode==='opd'){ const L=st.life, ex=L.運動.freq?`運動 ${L.運動.freq} 次/週`:'無運動習慣';
    return [['讀取病人診斷',`${x.dg.main}${c.sheet.stage_label?` · ${c.sheet.stage_label}`:''}；共病 ${x.dg.dx.length} 項`],
      ['讀取飲食紀錄（本次門診）',`「${st.dietText.slice(0,26)}${st.dietText.length>26?'…':''}」· 實際攝取 ${x.intake.kcal} 大卡 → 建議 ${st.kcal} 大卡、蛋白質 ${st.protein} g`],
      ['讀取檢驗數值',`${c.labs.filter(r=>r.src==='HIS檢驗').length} 筆 · HbA1c ${lab(c,'HbA1C').value}% · Cr ${x.cr.value} · eGFR ${Math.round(x.egfr)}`],
      ['參考營養診斷與生活習慣',`${st.ncp.filter(n=>n.P).map(n=>n.P.replace(/^\S+ /,'')).join('、')} · ${ex}`],
      ['換算六大類份量',portions],
      ['挑選個人化衛教重點',`${ai.key.length} 項提醒 · ${ai.goals.length} 項營養教育目標${flagsOf(c,x).length?' · 依 '+flagsOf(c,x).join('、'):''}`],
      ['排版衛教單張與圖示','依營養部衛教單張範本'],
      ['產生 QR Code','病人可用手機掃描查看']]; }
  return [['讀取診斷、護理紀錄、檢驗',`${x.dg.main} · 護理紀錄 ${c.visits.length} 筆 · 檢驗 ${c.labs.filter(r=>r.src==='HIS檢驗').length} 筆`],
    ['讀取營養師訪視紀錄（P9）',`目前攝取 ${x.intake.kcal} 大卡 → 建議 ${st.kcal} 大卡、蛋白質 ${st.protein} g`],
    ['換算六大類份量',portions],
    ['挑選個人化衛教重點',`${ai.key.length} 項提醒 · ${ai.goals.length} 項營養教育目標${flagsOf(c,x).length?' · 依 '+flagsOf(c,x).join('、'):''}`],
    ['排版衛教單張與圖示','依營養部衛教單張範本'],
    ['產生 QR Code','病人可用手機掃描查看']];
}
async function runVisitGen(c, st, title){
  busy=true; skipAnim=false;
  const ta=document.querySelector('textarea[data-f=note1]'); if(!ta){ busy=false; return; }
  const fld=ta.closest('.fld'), host=document.createElement('div'); fld.before(host);
  ta.value=''; ta.readOnly=true; fld.classList.add('dim');
  await aiWork(host,title,visitSteps(c,derive(c,st)));
  fld.classList.remove('dim');
  const text=AI1[c.code](c,baseOf(c,st));
  await typeInto(ta,text);
  host.querySelector('.aw-t').textContent='完成，已回寫 HIS 備註欄'; host.querySelector('.aiwork').classList.add('done');
  await sleep(700);
  st.note1=text; st.note1Edited=false; st.ai1At=new Date(); busy=false; skipAnim=false;
  if(DATA[cur]===c && mode==='ipd' && tab==='visit'){ render(); toast('AI 訪視紀錄已產生並回寫 HIS'); }
}
async function runFlyerGen(c, st){
  busy=true; skipAnim=false; st.generating=true; tab='flyer'; render(); window.scrollTo({top:0,behavior:'smooth'});
  await aiWork($('#aihost'),'AI 產生衛教單張',flyerSteps(c,st,derive(c,st)));
  $('#aihost .aw-t').textContent='完成'; $('#aihost .aiwork').classList.add('done');
  await sleep(500);
  st.flyer=buildFlyer(c,st,derive(c,st)); st.f2='draft'; st.generating=false; st.reveal=true; busy=false; skipAnim=false;
  render(); toast('衛教單張已產生，請審視');
}

const rdName=()=>($('#rd')?.value||'營養師').trim();
function openModal(html){ const m=$('#mask'); m.innerHTML=`<div class="modal">${html}</div>`; m.classList.add('on'); }
function closeModal(){ $('#mask').classList.remove('on'); $('#mask').innerHTML=''; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),1800); }
function goTab(t){ tab=t; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ---------- 事件 ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) { if(e.target===$('#mask')) closeModal(); return; }
  const c=DATA[cur], st=S(c), act=b.dataset.act, opd=mode==='opd';
  if(act==='skip'){ skipAnim=true; return; }
  if(busy) return;
  if(act==='pick'){ cur=+b.dataset.i; render(); window.scrollTo(0,0); }
  else if(act==='mode'){ if(mode!==b.dataset.m){ mode=b.dataset.m; tab=TAB0[mode];
      try{ const u=new URL(location.href); if(mode==='opd') u.searchParams.set('mode','opd'); else u.searchParams.delete('mode'); u.searchParams.delete('tab'); history.replaceState(null,'',u); }catch(_){}
      render(); window.scrollTo(0,0); } }
  else if(act==='tab'){ goTab(b.dataset.t); }
  else if(act==='regen1'){ runVisitGen(c,st,'AI 重新產生營養師訪視紀錄'); }
  else if(act==='fill'){ const sh=c.sheet;
    st.recall=Object.fromEntries(MEALS.map(m=>[m,clone(sh.intake[m]||{})]));
    if(opd){ const d=OPD_DEMO[c.code], x=derive(c,st), ss=ncpS(c,st,x);
      if(!st.dietText.trim()) st.dietText=`${sh.S}（${sh.pattern}）`;
      st.ncp=d.ncp.map(([cat,P,E,si])=>({cat,P,E,S:ss[si]}));
      LEARN.forEach(([k],i)=>st.learn[k]=d.learn[i]);
      st.interv=[...d.interv];
      tab='orec'; }
    else { if(!st.supplement.trim()) st.supplement=visitNote(c); if(tab==='input') tab='visit'; }
    render(); }
  else if(act==='replan'){ const x=derive(c,st); const p=distribute(makePlan(st.kcal,st.protein,x.ckdLow),st.meals);
    st.plan=Object.fromEntries(MEALS.map(m=>[m,clone(p[m]||{})])); render(); toast('已依目標熱量與蛋白質重新分配'); }
  else if(act==='confirm1'){ st.f1='done'; st.f1At=nowRoc(); tab=opd?'orec':'visit'; render(); toast(opd?'門診營養紀錄已完成':'訪視紀錄已確認並更新 HIS'); }
  else if(act==='unconfirm1'){ st.f1=opd?'todo':'his'; if(st.f2==='saved'||st.f2==='review'){ st.f2='draft'; st.savedAt=null; st.sig=null; st.sigDraft=null; } render(); }
  else if(act==='gen2'){ runFlyerGen(c,st); }
  else if(act==='hide'){ st.flyer.on[b.dataset.f]=false; render(); }
  else if(act==='show'){ st.flyer.on[b.dataset.f]=true; render(); }
  else if(act==='ncp-add'){ st.ncp.push({cat:'',P:'',E:'',S:''}); render(); }
  else if(act==='ncp-del'){ st.ncp.splice(+b.dataset.i,1); render(); }
  else if(act==='save2'&&opd){ st.f2='review'; goTab('sign'); toast('已審視，請病人簽名'); }
  else if(act==='back-edit'){ st.f2='draft'; st.sigDraft=null; goTab('flyer'); }
  else if(act==='sig-clear'){ st.sigDraft=null; render(); }
  else if(act==='save2'||act==='sig-save'){
    openModal(`<div class="mh">${ic('upload')}回寫 HIS 存檔 · 個案 ${c.code}</div><div class="mb">
      <p style="margin-top:0">衛教單張與 QR Code${opd?'、病人簽名':''}將回寫 HIS「營養教育及諮詢處置」，存檔為本次病歷。</p>
      <div class="sum" style="margin-bottom:16px"><div class="b">建議熱量<b>${st.kcal} kcal</b></div><div class="b">蛋白質<b>${st.protein} g</b></div><div class="b">教育目標<b>${st.flyer.goals.length} 項</b></div>${opd?'<div class="b ok">病人簽名<b>✓ 已簽</b></div>':''}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">返回修改</button><button class="btn pri" data-act="confirm-save">${ic('check','sm')}確認存檔</button></div></div>`); }
  else if(act==='confirm-save'){ st.f2='saved'; st.savedAt=nowRoc(); if(opd) st.sig=st.sigDraft; closeModal(); tab=opd?'sign':'flyer'; render(); toast('已回寫 HIS 存檔為病歷'); }
  else if(act==='unsave'){ st.f2=opd?'review':'draft'; st.savedAt=null; if(opd){ st.sig=null; st.sigDraft=null; } render(); }
  else if(act==='print'){ if(tab!=='flyer'){ tab='flyer'; render(); } setTimeout(()=>window.print(),50); }
  else if(act==='close'){ closeModal(); }
});
document.addEventListener('change', e=>{
  const el=e.target, k=el.dataset.kind; if(!k||busy) return;
  const c=DATA[cur], st=S(c);
  if(k==='set'){ const f=el.dataset.f; let v=el.value;
    if('num' in el.dataset || /^extra\.pg\.(intake|act)$/.test(f)) v=v===''?null:+v;
    setPath(st,f,v);
    if(/^ncp\.\d+\.cat$/.test(f)) setPath(st,f.replace(/cat$/,'P'),''); }
  else if(k==='arr'){ const a=getPath(st,el.dataset.f), v=el.dataset.v, i=a.indexOf(v);
    if(el.checked&&i<0) a.push(v); else if(!el.checked&&i>=0) a.splice(i,1); }
  else if(k==='bool'){ setPath(st,el.dataset.f,el.checked); }
  else if(k==='recall'||k==='plan'){ const v=parseFloat(el.value); const m=st[k][el.dataset.meal];
    if(v>0) m[el.dataset.g]=v; else delete m[el.dataset.g]; }
  else if(k==='num'){ const v=parseFloat(el.value); if(!isNaN(v)) st[el.dataset.f]=v; }
  else if(k==='goal'){ const g=el.dataset.f, gs=st.flyer.goals; if(el.checked){ if(!gs.includes(g)) gs.push(g);} else st.flyer.goals=gs.filter(x=>x!==g); }
  else if(k==='text'){ render(); return; }
  render();
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.kind==='text'){ const st=S(DATA[cur]), f=el.dataset.f; setPath(st,f,el.value);
    if(f==='note1'&&!st.note1Edited){ st.note1Edited=true; const tag=el.closest('.fld').querySelector('.aitag'); if(tag){tag.textContent='營養師已修改';tag.classList.add('edited');} }
    if(f==='supplement'||'req' in el.dataset) el.classList.toggle('req',!el.value.trim());
    const pre=document.querySelector('.hisprev pre'); if(pre){ const c=DATA[cur]; pre.textContent=hisNote(c,st,derive(c,st)); }
    return; }
  if(el.dataset.fly){ const fl=S(DATA[cur]).flyer, id=el.dataset.fly, i=+el.dataset.i, v=el.textContent;
    if(id==='key'||id==='avoid') fl[id][i]=v;
    else if(id==='weight') fl.weight.text=v;
    else if(id==='out') fl.out[i?'warn':'tip']=v;
    else if(id==='exercise') fl.exercise=v; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* 病人手機掃描 QR Code 後的單張頁 */
if(QS.get('view')==='flyer'){
  const c=DATA[cur], st=S(c);
  st.recall=Object.fromEntries(MEALS.map(m=>[m,clone(c.sheet.intake[m]||{})]));
  const x=derive(c,st); st.flyer=buildFlyer(c,st,x); st.f2='saved'; st.savedAt=roc(c.sheet.date);
  document.body.classList.add('flyer-only');
  document.body.innerHTML=`<div class="paper">${flyerHTML(c,st,x,false)}</div><div class="demo-foot">示範頁面：內容為去識別化個案的 AI 示範單張</div>`;
  drawQR();
} else {
  try{ const n=localStorage.getItem('rdName'); if(n) $('#rd').value=n; }catch(_){}
  $('#rd').addEventListener('change',e=>{ try{localStorage.setItem('rdName',e.target.value)}catch(_){} render(); });
  render();
}
