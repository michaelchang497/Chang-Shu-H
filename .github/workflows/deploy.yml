name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build 衛教中心 (src/ React app) -> dist/
        run: |
          npm ci
          npm run build
      - name: Keep legacy bundle (含營養部) as legacy.html
        run: |
          cp Chang-Shu-H-main/index.html dist/legacy.html
          sed -i 's#</body>#<script src="inject-nav.js"></script></body>#' dist/legacy.html
          grep -q 'inject-nav.js' dist/legacy.html
      - name: Add 營養照護紀錄 page
        run: cp site/nutrition.html site/inject-nav.js dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
